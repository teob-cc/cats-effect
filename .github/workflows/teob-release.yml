# Publishes the teob-cc fork as cc.teob to Sonatype Central.
# Same secrets as jacum/pekko-sensors: SONATYPE_USER, SONATYPE_PASSWORD, GPG_SECRET, GPG_PASS.
# Not generated by sbt-typelevel (unlike ci.yml), so githubWorkflowCheck leaves it alone.

name: Release cc.teob to Sonatype

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 3.7.2-teob.1'
        required: true
      run_tests:
        description: 'Run JVM tests before publishing'
        type: boolean
        default: true

permissions:
  contents: write # pushes the release tag

concurrency:
  group: teob-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TEOB_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # sbt-typelevel derives the MiMa baselines from upstream release tags
      - name: Fetch upstream tags
        run: git fetch --no-tags https://github.com/typelevel/cats-effect.git '+refs/tags/v3.*:refs/tags/v3.*'

      - name: Check version is new
        run: |
          if git rev-parse -q --verify "refs/tags/teob-v$TEOB_VERSION" >/dev/null; then
            echo "teob-v$TEOB_VERSION already exists" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Import GPG private key
        env:
          GPG_SECRET: ${{ secrets.GPG_SECRET }}
          GPG_PASS: ${{ secrets.GPG_PASS }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          printf "%s" "$GPG_SECRET" | gpg --batch --passphrase "$GPG_PASS" --import
          # sbt-typelevel signs non-interactively, so drop the passphrase on this throwaway runner
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')
          (echo "$GPG_PASS"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase "$KEY"
          gpg --list-secret-keys

      - name: Run tests
        if: inputs.run_tests
        run: sbt '++ 2.13' testsJVM/test ioAppTestsJVM/test pekko/test

      # tlRelease plus the fork-only modules from teob.sbt, which the upstream root doesn't aggregate
      - name: Publish (all Scala versions and platforms) and release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: sbt +mimaReportBinaryIssues +publish +pekko/publish tlSonatypeBundleReleaseIfRelevant

      - name: Tag release
        run: |
          git tag "teob-v$TEOB_VERSION"
          git push origin "teob-v$TEOB_VERSION"
